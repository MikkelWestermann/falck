name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: clone opencode repo
        run: git clone --depth 1 --branch production https://github.com/anomalyco/opencode.git opencode
      - name: detect bun version
        id: bun-version
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('node:fs');
          const path = require('node:path');

          const packageJsonPath = path.join(process.cwd(), 'opencode', 'package.json');
          const packageJson = JSON.parse(fs.readFileSync(packageJsonPath, 'utf8'));
          const match = (packageJson.packageManager || '').match(/bun@([0-9]+\.[0-9]+\.[0-9]+)/);
          const bunVersion = match?.[1] ?? '1.3.10';

          console.log(`bun_version=${bunVersion}`);
          NODE
      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun-version.outputs.bun_version }}
      - name: install opencode deps
        run: bun install
        working-directory: opencode
      - name: install frontend deps
        run: bun install
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_SOURCE: repo
          GITHUB_CLIENT_ID: ${{ secrets.FALCK_GITHUB_CLIENT_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: v__VERSION__
          releaseName: "Falck v__VERSION__"
          releaseBody: "Release notes here."
          releaseDraft: true
          includeUpdaterJson: true
          args: ${{ matrix.args }}
